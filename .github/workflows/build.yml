name: Build Receiver Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1.1.2

      - name: Install ESP32 Platform & Libraries
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "ArduinoJson"

      - name: Compile Firmware to Binary
        run: |
          mkdir -p build_output
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build_output ./src/main.ino

      - name: Upload .bin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: receiver-firmware-bin
          path: build_output/*.bin
